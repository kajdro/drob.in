<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Kaj Drobin — Design and Product in Stockholm.">
    <meta name="theme-color" content="#171b1c">
    <title>Kaj Drobin — Design and Product</title>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("assets/inter-variable.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }

      @font-face {
        font-family: "Geist";
        src: url("assets/geist.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --background: #171b1c;
        --text: #f4f6f8;
        --secondary: rgba(244, 246, 248, 0.3);
        --line: rgba(255, 255, 255, 0.15);
        --character-height: clamp(3.25rem, 4.2vw, 4.25rem);
        --content-width: min(clamp(18rem, 23.3vw, 23.5rem), calc(100vw - 3.5rem), calc(61.8svh - 2.163rem));
        --timeline-origin: calc(50% - var(--content-width) / 2);
        --timeline-y: calc(50% - clamp(1rem, 3svh, 2.5rem));
        --spacing: clamp(11rem, 24.5vw, 22rem);
        --regular: 500;
        --medium: 500;
      }

      * {
        box-sizing: border-box;
      }

      html {
        overscroll-behavior: none;
        overflow-anchor: none;
        background: var(--background);
      }

      body {
        overscroll-behavior: none;
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: "Inter", "Helvetica Neue", "Geist", sans-serif;
        font-size: 1.125rem;
        font-weight: var(--regular);
        line-height: 1.45;
        letter-spacing: -0.018em;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body::after {
        content: "";
        position: fixed;
        z-index: 20;
        inset: 0;
        border: clamp(7px, 1vw, 14px) solid var(--text);
        pointer-events: none;
      }

      .scroll-space {
        height: 1400vh;
      }

      .stage {
        touch-action: pinch-zoom;
        position: sticky;
        top: 0;
        height: 100vh;
        height: 100svh;
        overflow: hidden;
        isolation: isolate;
      }

      .site-title {
        position: absolute;
        z-index: 5;
        top: clamp(1.5rem, 4vw, 2.5rem);
        left: clamp(1.5rem, 4vw, 3.5rem);
        display: none;
        margin: 0;
        font-size: 0.8125rem;
        font-weight: var(--medium);
        line-height: 1.35;
        letter-spacing: -0.006em;
      }

      .site-title span {
        display: block;
        color: var(--secondary);
        font-weight: var(--regular);
      }

      .scroll-prompt {
        position: absolute;
        z-index: 5;
        top: clamp(1.5rem, 4vw, 2.5rem);
        right: clamp(1.5rem, 4vw, 3.5rem);
        display: none;
        margin: 0;
        color: var(--secondary);
        font-size: 0.8125rem;
        letter-spacing: -0.006em;
        transition: opacity 180ms ease-out;
      }

      .scroll-prompt.is-hidden {
        opacity: 0;
      }

      .character {
        position: absolute;
        z-index: 4;
        left: var(--timeline-origin);
        top: calc(var(--timeline-y) - 1rem);
        bottom: auto;
        width: 0;
        height: 0;
        opacity: 0;
        transform: translate3d(0, 0.35rem, 0);
        transition:
          opacity 360ms ease-out,
          transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .stage.show-character .character {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }

      .character-sprite {
        position: absolute;
        bottom: 0;
        left: 0;
        background-repeat: no-repeat;
        image-rendering: pixelated;
        transform: translate3d(0, 0, 0);
        transform-origin: 50% 100%;
        transition: none;
        will-change: opacity;
      }

      .character.is-facing-left .character-sprite {
        transform: scaleX(-1);
      }

      .character-turn {
        /* Four equally spaced views share one body scale and ground line. */
        width: calc(var(--character-height) * 305 / 660);
        height: calc(var(--character-height) * 676 / 660);
        bottom: calc(0.6rem - var(--character-height) * 8 / 660);
        background-image: url("assets/kaj-turn-right.png");
        background-position: 0% 0%;
        background-size: 400% 100%;
        opacity: 1;
      }

      .character-motion {
        visibility: hidden;
        width: calc(var(--character-height) * 264 / 525);
        height: calc(var(--character-height) * 541 / 525);
        bottom: calc(0.6rem - var(--character-height) * 8 / 525);
        background-image: url("assets/kaj-walk-clean.png");
        background-position: 0% 0%;
        background-size: 800% 100%;
        opacity: 0;
      }

      .character-motion:not(.is-running) {
        filter: brightness(0.9) saturate(0.88) contrast(1.04);
      }

      .character-motion.is-running {
        /* Eight 271.5px cells; crop the sheet's top/bottom padding in CSS. */
        width: calc(var(--character-height) * 271.5 / 424);
        height: var(--character-height);
        bottom: 0.6rem;
        background-size: 800% auto;
        --sprite-y: 56%;
      }

      .timeline-window {
        position: absolute;
        z-index: 2;
        top: var(--timeline-y);
        left: 0;
        width: 100%;
        height: 8rem;
        mask-image: linear-gradient(to right, black, black 92%, transparent);
        opacity: 0;
        transition: opacity 420ms ease-out;
      }

      .stage.show-timeline .timeline-window {
        opacity: 1;
      }

      .timeline-track {
        position: absolute;
        top: 0;
        left: var(--timeline-origin);
        height: 100%;
        will-change: transform;
      }

      .timeline-line {
        position: absolute;
        top: 0;
        left: 0;
        width: calc(17 * var(--spacing) + 100vw);
        height: 1px;
        background-color: rgba(255, 255, 255, 0.025);
        background-image: linear-gradient(to right, rgba(255, 255, 255, 0.19), rgba(255, 255, 255, 0.07) 42%, transparent 90%);
        background-size: 100vw 100%;
        background-repeat: no-repeat;
        background-position: var(--travel, 0px) 0;
        transform: scaleX(0);
        transform-origin: 0 50%;
        transition: transform 560ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .stage.show-timeline .timeline-line {
        transform: scaleX(1);
      }

      .year-mark {
        appearance: none;
        border: 0;
        padding: 0;
        background: none;
        font-family: inherit;
        font-weight: inherit;
        cursor: pointer;
        position: absolute;
        top: 1.35rem;
        left: calc(var(--index) * var(--spacing));
        width: 5rem;
        transform: none;
        color: var(--text);
        text-align: left;
        font-size: 0.6875rem;
        line-height: 1rem;
        letter-spacing: 0.02em;
        opacity: 0.3;
      }

      .year-mark:focus-visible {
        outline: 1px solid currentColor;
        outline-offset: 5px;
      }

      .year-mark::before {
        content: none;
      }

      .center-notch {
        display: none;
      }

      .chapter {
        position: absolute;
        z-index: 4;
        top: calc(var(--timeline-y) + 4.25rem);
        left: var(--timeline-origin);
        width: var(--content-width);
        transform: none;
        text-align: left;
        opacity: 0;
        transform: translate3d(0, 0.35rem, 0);
        transition:
          opacity 180ms ease-out,
          transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .stage.show-info .chapter {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }

      .chapter-date,
      .chapter-company,
      .chapter-description {
        margin: 0;
      }

      .chapter-date,
      .chapter-company,
      .chapter-description {
        color: var(--text);
        font-size: 0.6875rem;
        line-height: 1rem;
        letter-spacing: 0.03em;
      }

      .chapter-date {
        display: none;
      }

      .chapter-role {
        margin: 0;
        font-size: 0.6875rem;
        font-weight: var(--regular);
        line-height: 1rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .chapter-company {
        margin-top: 0;
        text-transform: uppercase;
      }

      .chapter-description {
        font-weight: 400;
        max-width: 20.9375rem;
        margin: 1.75rem 0 0;
        font-size: 0.875rem;
        line-height: 1.125rem;
        letter-spacing: 0.01em;
      }

      .chapter-description a {
        color: inherit;
        font-weight: 450;
        text-decoration: none;
        white-space: nowrap;
      }

      .chapter-description a:hover,
      .contact-card a:hover {
        color: #a9adaf;
      }

      a:focus-visible {
        outline: 1px solid currentColor;
        outline-offset: 4px;
      }

      .contact-card {
        position: absolute;
        z-index: 6;
        top: clamp(1.75rem, 3vw, 2.75rem);
        left: clamp(1.75rem, 3vw, 2.75rem);
        right: clamp(1.75rem, 3vw, 2.75rem);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem 2rem;
        margin: 0;
        color: var(--text);
        font-size: 0.6875rem;
        font-weight: var(--regular);
        line-height: 1rem;
        letter-spacing: 0.03em;
        text-align: left;
        text-transform: uppercase;
        opacity: 0;
        transform: translate3d(0, 0.35rem, 0);
        transition:
          opacity 360ms ease-out,
          transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .stage.show-info .contact-card {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }

      .contact-card p {
        margin: 0;
      }

      .contact-card nav {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 0.5rem clamp(0.75rem, 2vw, 2rem);
      }

      .contact-card p,
      .contact-card a {
        white-space: nowrap;
      }

      .contact-card a {
        display: block;
        width: max-content;
        color: var(--text);
        font-weight: 450;
        text-decoration: none;
      }


      .progress {
        display: none;
        position: absolute;
        z-index: 5;
        right: clamp(1.5rem, 4vw, 3.5rem);
        bottom: clamp(1.5rem, 4vw, 2.5rem);
        width: 3rem;
        height: 1px;
        background: var(--line);
      }

      .progress span {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--text);
        transform: scaleX(0);
        transform-origin: 0 50%;
        will-change: transform;
      }

      @media (max-height: 43rem) {
        .chapter-description {
          margin-top: 1.25rem;
        }
      }

      @media (max-width: 38rem) {
        .scroll-prompt {
          display: none;
        }

        .contact-card {
          top: 1.5rem;
          left: 1.5rem;
          right: 1.5rem;
          gap: 0.75rem 1.25rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .scroll-prompt,
        .year-mark,
        .chapter,
        .character,
        .character-sprite {
          transition: none;
        }

        .timeline-window,
        .timeline-line,
        .contact-card {
          transition: none;
        }

      }
    </style>
  </head>
  <body>
    <main class="scroll-space">
      <section class="stage" aria-label="Kaj Drobin career timeline">
        <h1 class="site-title">Kaj Drobin<span>Design and Product</span></h1>
        <p class="scroll-prompt">Scroll to walk back in time</p>

        <aside class="contact-card" aria-label="About and contact">
          <p>Kaj Drobin<br>Design and Product</p>
          <nav aria-label="Contact links">
            <a href="mailto:kaj@drob.in">Email</a>
            <a href="https://x.com/kajdro">X</a>
            <a href="https://www.linkedin.com/in/kajdrobin">LinkedIn</a>
          </nav>
        </aside>

        <div class="character" role="img" aria-label="8-bit character of Kaj Drobin">
          <span class="character-sprite character-turn"></span>
          <span class="character-sprite character-motion"></span>
        </div>

        <div class="timeline-window" aria-label="Choose a year">
          <div class="timeline-track" id="timeline-track">
            <div class="timeline-line"></div>
            <button type="button" class="year-mark" style="--index: 0">Now</button>
            <button type="button" class="year-mark" style="--index: 1">2025</button>
            <button type="button" class="year-mark" style="--index: 2">2024</button>
            <button type="button" class="year-mark" style="--index: 3">2023</button>
            <button type="button" class="year-mark" style="--index: 4">2022</button>
            <button type="button" class="year-mark" style="--index: 5">2021</button>
            <button type="button" class="year-mark" style="--index: 6">2020</button>
            <button type="button" class="year-mark" style="--index: 7">2019</button>
            <button type="button" class="year-mark" style="--index: 8">2018</button>
            <button type="button" class="year-mark" style="--index: 9">2017</button>
            <button type="button" class="year-mark" style="--index: 10">2016</button>
            <button type="button" class="year-mark" style="--index: 11">2015</button>
            <button type="button" class="year-mark" style="--index: 12">2014</button>
            <button type="button" class="year-mark" style="--index: 13">2013</button>
            <button type="button" class="year-mark" style="--index: 14">2012</button>
            <button type="button" class="year-mark" style="--index: 15">2011</button>
            <button type="button" class="year-mark" style="--index: 16">2010</button>
            <button type="button" class="year-mark" style="--index: 17">2009</button>
          </div>
        </div>
        <div class="center-notch" aria-hidden="true"></div>

        <article class="chapter" id="chapter">
          <p class="chapter-date" id="chapter-date">2024–Now</p>
          <h2 class="chapter-role" id="chapter-role">Co-Founder</h2>
          <p class="chapter-company" id="chapter-company">Stilla</p>
          <p class="chapter-description" id="chapter-description">Building <a href="https://stilla.ai/">Stilla</a>, a multiplayer AI teammate, with the sharpest people I’ve worked with in the past 15 years.</p>
        </article>

        <div class="progress" aria-hidden="true"><span id="progress"></span></div>
      </section>
    </main>

    <script>
      const years = Array.from(document.querySelectorAll('.year-mark'))
      const track = document.querySelector('#timeline-track')
      const character = document.querySelector('.character')
      const turnCharacter = document.querySelector('.character-turn')
      const motionCharacter = document.querySelector('.character-motion')
      const chapter = document.querySelector('#chapter')
      const date = document.querySelector('#chapter-date')
      const role = document.querySelector('#chapter-role')
      const company = document.querySelector('#chapter-company')
      const description = document.querySelector('#chapter-description')
      const prompt = document.querySelector('.scroll-prompt')
      const progressBar = document.querySelector('#progress')
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches

      const chapters = [
        {
          from: 0,
          to: 1,
          date: '2024–Now',
          role: 'Co-Founder',
          company: 'Stilla',
          description: 'Building <a href="https://stilla.ai/">Stilla</a>, a multiplayer AI teammate, with the sharpest people I’ve worked with in the past 15 years.'
        },
        {
          from: 2,
          to: 8,
          date: '2018–2024',
          role: 'Director of Product',
          company: 'Shopify',
          description: 'Co-created <a href="https://shop.app/">Shop</a> and <a href="https://shop.app/shop-pay">Shop Pay</a> and led their early product and design.'
        },
        {
          from: 9,
          to: 15,
          date: '2011–2018',
          role: 'CPO and Co-Founder',
          company: 'Tictail',
          description: 'Led product and design as Tictail grew to 100k+ online stores and was acquired by Shopify.'
        },
        {
          from: 16,
          to: 17,
          date: '2009–2011',
          role: 'Designer and Partner',
          company: 'Identity Works',
          description: "Built the digital team. Created Spotify’s early brand guidelines, launch party, and launch films, including for its US debut."
        }
      ]

      let currentChapter = 0
      let pendingChapter = 0
      let chapterTimer
      let ticking = false
      let spacing
      let targetProgress = 0
      let displayedProgress = 0
      let progressVelocity = 0
      let lastInputY = window.scrollY
      let lastInputTime = performance.now()
      let lastFrameTime = performance.now()
      let lastVisualIndex = 0
      let spritePhase = 0
      let motionMode = 'walk'
      let runUntil = 0
      let lastCharacterMotionTime = -Infinity
      let characterTurn = 0
      let fastInputSamples = 0
      let automaticWalk = null
      let travelDirection = 1

      const TURN_SCROLL_DISTANCE = 140
      const spritePositions = Array.from({ length: 8 }, (_, index) => `${index / 7 * 100}%`)
      const turnPositions = ['0%', '33.333%', '66.667%', '100%']
      const walkSprite = 'url("assets/kaj-walk-clean.png")'
      const runSprite = 'url("assets/kaj-run-refined.png")'

      ;['assets/kaj-turn-right.png', 'assets/kaj-walk-clean.png', 'assets/kaj-run-refined.png'].forEach((source) => {
        const image = new Image()
        image.src = source
      })

      const getSpacing = () => {
        const probe = document.createElement('div')
        probe.style.cssText = 'position:absolute;width:var(--spacing);visibility:hidden'
        document.body.appendChild(probe)
        const width = probe.getBoundingClientRect().width
        probe.remove()
        return width
      }

      const setChapter = (index) => {
        if (index === pendingChapter) return
        pendingChapter = index
        clearTimeout(chapterTimer)
        if (index === currentChapter) {
          chapter.style.opacity = '1'
          return
        }
        const update = () => {
          currentChapter = index
          const content = chapters[index]
          date.textContent = content.date
          role.textContent = content.role
          company.textContent = content.company
          description.innerHTML = content.description
          chapter.style.opacity = '1'
        }
        if (reduceMotion) {
          update()
        } else {
          chapter.style.opacity = '0'
          chapterTimer = setTimeout(update, 140)
        }
      }

      const getProgress = () => {
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight
        const timelineDistance = maxScroll - TURN_SCROLL_DISTANCE
        return timelineDistance > 0
          ? Math.min(1, Math.max(0, (window.scrollY - TURN_SCROLL_DISTANCE) / timelineDistance))
          : 0
      }

      const setMotionMode = (mode) => {
        if (mode === motionMode) return
        motionMode = mode
        motionCharacter.style.backgroundImage = motionMode === 'run' ? runSprite : walkSprite
        motionCharacter.classList.toggle('is-running', motionMode === 'run')
      }

      const render = (now) => {
        ticking = false
        const deltaTime = Math.min(64, Math.max(1, now - lastFrameTime))
        // Exact critically damped spring: preserve velocity across gestures,
        // with no bounce and the same response at every display refresh rate.
        if (reduceMotion) {
          displayedProgress = targetProgress
          progressVelocity = 0
        } else {
          const seconds = deltaTime / 1000
          const frequency = touchGesture?.axis ? 22 : 9.5
          const offset = displayedProgress - targetProgress
          const momentum = progressVelocity + frequency * offset
          const decay = Math.exp(-frequency * seconds)
          displayedProgress = targetProgress + (offset + momentum * seconds) * decay
          progressVelocity = (progressVelocity - frequency * momentum * seconds) * decay
          if (displayedProgress < 0 || displayedProgress > 1) {
            displayedProgress = Math.max(0, Math.min(1, displayedProgress))
            progressVelocity = 0
          }
          if (Math.abs(displayedProgress - targetProgress) < 0.000005 && Math.abs(progressVelocity) < 0.00002) {
            displayedProgress = targetProgress
            progressVelocity = 0
          }
        }

        const exactIndex = displayedProgress * (years.length - 1)
        const yearIndex = Math.min(years.length - 1, Math.floor(exactIndex + 0.000001))
        track.style.transform = `translate3d(${-exactIndex * spacing}px, 0, 0)`
        track.style.setProperty('--travel', `${exactIndex * spacing}px`)
        progressBar.style.transform = `scaleX(${displayedProgress})`
        prompt.classList.toggle('is-hidden', displayedProgress > 0.025)

        const inputStillActive = window.scrollY > 0 && now - lastInputTime < 160
        const motionActive = automaticWalk !== null || swipeMomentum !== null || Boolean(touchGesture && (touchGesture.axis || characterTurn > 0)) || inputStillActive || Math.abs(progressVelocity) > 0.00002 || Math.abs(displayedProgress - targetProgress) > 0.000005
        if (motionActive) lastCharacterMotionTime = now
        // Hold the side pose through touch-event gaps and between quick swipes.
        const isMoving = !reduceMotion && (motionActive || now - lastCharacterMotionTime < 420)
        // Pose follows gesture state, never an asynchronously updated scroll offset.
        characterTurn = reduceMotion ? 0 : Math.max(0, Math.min(1,
          characterTurn + (isMoving ? deltaTime / 100 : -deltaTime / 160)))
        const turnFrame = Math.min(3, Math.round(characterTurn * 3))
        const showMotion = characterTurn === 1
        character.classList.toggle('is-facing-left', characterTurn > 0 && travelDirection < 0)
        turnCharacter.style.backgroundPosition = `${turnPositions[turnFrame]} 0%`
        // A single visible sprite avoids ghosting between overlapping silhouettes.
        turnCharacter.style.visibility = showMotion ? 'hidden' : 'visible'
        motionCharacter.style.visibility = showMotion ? 'visible' : 'hidden'
        turnCharacter.style.opacity = '1'
        motionCharacter.style.opacity = '1'

        // Pin the current label until the next one pushes it off the anchor.
        // These offsets share the timeline spring, including when scrolling back.
        const handoffWidth = 48
        const nextDistance = (yearIndex + 1 - exactIndex) * spacing
        const handoff = Math.max(0, Math.min(1, 1 - nextDistance / handoffWidth))
        years.forEach((year, index) => {
          const naturalX = (index - exactIndex) * spacing
          const isCurrent = index === yearIndex
          const pinnedX = Math.min(0, nextDistance - handoffWidth)
          const offset = isCurrent ? pinnedX - naturalX : index < yearIndex ? spacing - handoffWidth : 0
          year.style.transform = `translate3d(${offset}px, 0, 0)`
          const emphasis = isCurrent ? 1 - handoff : index === yearIndex + 1 ? handoff : 0
          year.style.opacity = `${0.18 + emphasis * 0.52}`
        })

        const nextChapter = chapters.findIndex((item) => yearIndex >= item.from && yearIndex <= item.to)
        if (nextChapter >= 0) setChapter(nextChapter)

        if (!reduceMotion) {
          setMotionMode(automaticWalk || now < runUntil ? 'run' : 'walk')
          const visualDistance = Math.abs(exactIndex - lastVisualIndex) * spacing

          if (visualDistance > 0.02) {
            // Keep rapid gestures from skipping whole poses in the run cycle.
            spritePhase += Math.min(visualDistance / (motionMode === 'run' ? 18 : 42), deltaTime / (motionMode === 'run' ? 75 : 90))
            const frame = Math.floor(spritePhase) % 8
            motionCharacter.style.backgroundPosition = `${spritePositions[frame]} var(--sprite-y, 0%)`
          }
        }

        lastVisualIndex = exactIndex
        lastFrameTime = now

        if (displayedProgress !== targetProgress || progressVelocity !== 0 || inputStillActive || automaticWalk || isMoving || characterTurn > 0) requestRender()
      }

      const requestRender = () => {
        if (ticking) return
        ticking = true
        requestAnimationFrame(render)
      }

      let swipeMomentum = null
      const cancelAutomaticWalk = () => {
        if (swipeMomentum) cancelAnimationFrame(swipeMomentum.frame)
        swipeMomentum = null
        if (automaticWalk) cancelAnimationFrame(automaticWalk.frame)
        automaticWalk = null
        fastInputSamples = 0
        runUntil = 0
      }

      const walkToYear = (index) => {
        cancelAutomaticWalk()
        const startY = window.scrollY
        travelDirection = index >= displayedProgress * (years.length - 1) ? 1 : -1
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight
        const endY = index === 0 ? 0 : Math.min(maxScroll,
          Math.ceil(TURN_SCROLL_DISTANCE + index / (years.length - 1) * (maxScroll - TURN_SCROLL_DISTANCE)))
        if (reduceMotion) {
          window.scrollTo(0, endY)
          return
        }
        const distance = Math.abs(index - displayedProgress * (years.length - 1))
        const duration = Math.min(2000, Math.max(550, distance * 200))
        const journey = { frame: 0, started: performance.now(), index }
        automaticWalk = journey
        requestRender()
        const step = (now) => {
          if (automaticWalk !== journey) return
          const progress = Math.min(1, (now - journey.started) / duration)
          const eased = progress * progress * (3 - 2 * progress)
          window.scrollTo(0, startY + (endY - startY) * eased)
          runUntil = now + 450
          handleScroll()
          if (progress < 1) journey.frame = requestAnimationFrame(step)
          else automaticWalk = null
        }
        journey.frame = requestAnimationFrame(step)
      }

      years.forEach((year, index) => year.addEventListener('click', () => walkToYear(index)))
      window.addEventListener('wheel', () => {
        if (automaticWalk || swipeMomentum) cancelAutomaticWalk()
      }, { passive: true })
      let touchGesture = null
      let suppressSwipeClickUntil = 0
      // Horizontal swipes cover more ground; both axes share release physics.
      const coastAfterSwipe = (velocity) => {
        if (reduceMotion || Math.abs(velocity) < 0.08) return
        const coast = { frame: 0, time: performance.now(), position: window.scrollY, velocity }
        swipeMomentum = coast
        const step = (now) => {
          if (swipeMomentum !== coast) return
          const elapsed = Math.min(64, now - coast.time)
          coast.time = now
          const decay = Math.exp(-elapsed / 325)
          coast.position += coast.velocity * 325 * (1 - decay)
          coast.velocity *= decay
          const maxScroll = document.documentElement.scrollHeight - window.innerHeight
          coast.position = Math.max(0, Math.min(maxScroll, coast.position))
          window.scrollTo(0, coast.position)
          handleScroll()
          if (Math.abs(coast.velocity) < 0.02 || coast.position === 0 || coast.position === maxScroll) {
            swipeMomentum = null
          } else {
            coast.frame = requestAnimationFrame(step)
          }
        }
        coast.frame = requestAnimationFrame(step)
      }
      window.addEventListener('touchstart', (event) => {
        cancelAutomaticWalk()
        suppressSwipeClickUntil = 0
        const touch = event.touches[0]
        touchGesture = event.touches.length === 1
          ? { id: touch.identifier, x: touch.clientX, y: touch.clientY, scrollY: window.scrollY,
              axis: null, distance: 0, time: performance.now(), velocity: 0 }
          : null
      }, { passive: true })
      window.addEventListener('touchmove', (event) => {
        if (!touchGesture || event.touches.length !== 1) {
          touchGesture = null
          return
        }
        const touch = event.touches[0]
        if (touch.identifier !== touchGesture.id) return
        if (event.cancelable) event.preventDefault()
        const dx = touchGesture.x - touch.clientX
        const dy = touchGesture.y - touch.clientY
        if (!touchGesture.axis) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) < 6) return
          touchGesture.axis = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical'
        }
        const now = performance.now()
        const distance = touchGesture.axis === 'horizontal' ? dx * 1.7 : dy
        const elapsed = Math.max(8, now - touchGesture.time)
        const velocity = (distance - touchGesture.distance) / elapsed
        touchGesture.velocity = elapsed > 100 ? velocity : touchGesture.velocity * 0.25 + velocity * 0.75
        touchGesture.distance = distance
        touchGesture.time = now
        suppressSwipeClickUntil = now + 500
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight
        window.scrollTo(0, Math.max(0, Math.min(maxScroll, touchGesture.scrollY + distance)))
        handleScroll()
        requestRender()
      }, { passive: false })
      const endTouchGesture = (event) => {
        if (touchGesture?.axis) {
          const now = performance.now()
          suppressSwipeClickUntil = now + 500
          // Holding the finger still before lifting should stop the glide.
          if (event.type === 'touchend' && now - touchGesture.time < 100) {
            coastAfterSwipe(Math.max(-8, Math.min(8, touchGesture.velocity)))
          }
        }
        touchGesture = null
      }
      window.addEventListener('touchend', endTouchGesture, { passive: true })
      window.addEventListener('touchcancel', endTouchGesture, { passive: true })
      window.addEventListener('click', (event) => {
        if (performance.now() < suppressSwipeClickUntil) {
          event.preventDefault()
          event.stopImmediatePropagation()
        }
      }, { capture: true })
      window.addEventListener('keydown', (event) => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest('input, textarea, select, [contenteditable="true"]')) return
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) {
          event.preventDefault()
          if (event.repeat) return
          const direction = ['ArrowRight', 'ArrowDown'].includes(event.key) ? 1 : -1
          const currentIndex = automaticWalk ? automaticWalk.index : Math.floor(displayedProgress * (years.length - 1) + 0.000001)
          if (['ArrowLeft', 'ArrowRight'].includes(event.key)) {
            const chapterIndex = chapters.findIndex((item) => currentIndex >= item.from && currentIndex <= item.to)
            const destination = Math.max(0, Math.min(chapters.length - 1, chapterIndex + direction))
            if (destination !== chapterIndex) walkToYear(chapters[destination].from)
          } else {
            walkToYear(Math.max(0, Math.min(years.length - 1, currentIndex + direction)))
          }
        } else if (['PageDown', 'PageUp', 'Home', 'End', ' '].includes(event.key)) {
          cancelAutomaticWalk()
        }
      })

      const showEntrance = () => {
        const stage = document.querySelector('.stage')
        if (reduceMotion) {
          stage.classList.add('show-character', 'show-timeline', 'show-info')
          return
        }
        requestAnimationFrame(() => stage.classList.add('show-character'))
        setTimeout(() => stage.classList.add('show-timeline'), 360)
        setTimeout(() => stage.classList.add('show-info'), 780)
      }

      const handleResize = () => {
        spacing = getSpacing()
        targetProgress = getProgress()
        requestRender()
      }

      const handleScroll = () => {
        const now = performance.now()
        const deltaY = window.scrollY - lastInputY
        if (deltaY === 0) {
          targetProgress = getProgress()
          requestRender()
          return
        }
        const deltaTime = Math.max(16, now - lastInputTime)
        const velocity = Math.abs(deltaY) / deltaTime
        if (deltaY !== 0) travelDirection = Math.sign(deltaY)

        if (!ticking) lastFrameTime = now
        targetProgress = getProgress()
        if (deltaTime > 80) fastInputSamples = 0
        const touchInput = touchGesture !== null || swipeMomentum !== null
        const runThreshold = touchInput ? 5 : 2.4
        const requiredSamples = touchInput ? 3 : 2
        fastInputSamples = velocity > runThreshold ? fastInputSamples + 1 : Math.max(0, fastInputSamples - 1)
        if (!automaticWalk && fastInputSamples >= requiredSamples) runUntil = now + (touchInput ? 260 : 450)
        lastInputY = window.scrollY
        lastInputTime = now
        requestRender()
      }

      spacing = getSpacing()
      targetProgress = getProgress()
      displayedProgress = targetProgress
      lastVisualIndex = displayedProgress * (years.length - 1)
      window.addEventListener('scroll', handleScroll, { passive: true })
      window.addEventListener('resize', handleResize)
      showEntrance()
      requestRender()
    </script>
  </body>
</html>
