<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Kaj Drobin — Design & Product in Stockholm.">
    <meta name="theme-color" content="#080b10">
    <title>Kaj Drobin — Design & Product</title>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("assets/geist.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --background: #080b10;
        --text: #f4f6f8;
        --secondary: #858d99;
        --line: rgba(133, 141, 153, 0.18);
        --character-height: clamp(3.8rem, 6.04vw, 4.53rem);
        --spacing: clamp(11rem, 22vw, 20rem);
        --regular: 450;
        --medium: 550;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--background);
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: "Geist", sans-serif;
        font-size: 1.125rem;
        font-weight: var(--regular);
        line-height: 1.45;
        letter-spacing: -0.018em;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body::after {
        content: "";
        position: fixed;
        z-index: 20;
        inset: clamp(0.6rem, 1.25vw, 1rem);
        border: clamp(3px, 0.45vw, 6px) solid var(--text);
        pointer-events: none;
      }

      .scroll-space {
        height: 2200vh;
      }

      .stage {
        position: sticky;
        top: 0;
        height: 100vh;
        height: 100svh;
        overflow: hidden;
        isolation: isolate;
      }

      .site-title {
        position: absolute;
        z-index: 5;
        top: clamp(1.5rem, 4vw, 2.5rem);
        left: clamp(1.5rem, 4vw, 3.5rem);
        margin: 0;
        font-size: 0.8125rem;
        font-weight: var(--medium);
        line-height: 1.35;
        letter-spacing: -0.006em;
      }

      .site-title span {
        display: block;
        color: var(--secondary);
        font-weight: var(--regular);
      }

      .scroll-prompt {
        position: absolute;
        z-index: 5;
        top: clamp(1.5rem, 4vw, 2.5rem);
        right: clamp(1.5rem, 4vw, 3.5rem);
        margin: 0;
        color: var(--secondary);
        font-size: 0.8125rem;
        letter-spacing: -0.006em;
        transition: opacity 180ms ease-out;
      }

      .scroll-prompt.is-hidden {
        opacity: 0;
      }

      .character {
        position: absolute;
        z-index: 4;
        left: 50%;
        bottom: 42%;
        width: 0;
        height: 0;
      }

      .character-sprite {
        position: absolute;
        bottom: 0;
        left: 50%;
        background-repeat: no-repeat;
        image-rendering: pixelated;
        transform: translate3d(-50%, 0, 0);
        transform-origin: 50% 100%;
        transition: opacity 180ms ease-in-out;
        will-change: opacity;
      }

      .character-idle {
        /* Match the visible artwork, accounting for transparent sprite padding. */
        width: calc(var(--character-height) * 1024 / 1350);
        height: calc(var(--character-height) * 1536 / 1350);
        bottom: calc(0.6rem - var(--character-height) * 84 / 1350);
        background-image: url("assets/kaj-idle-front.png");
        background-position: 50% 100%;
        background-size: contain;
        opacity: 1;
      }

      .character-motion {
        width: calc(var(--character-height) * 124 / 214);
        height: calc(var(--character-height) * 397 / 214);
        bottom: calc(0.6rem - var(--character-height) * 91 / 214);
        background-image: url("assets/kaj-walk-right.png");
        background-position: 0% 0%;
        background-size: 800% 100%;
        opacity: 0;
      }

      .character.is-moving .character-idle {
        opacity: 0;
      }

      .character.is-moving .character-motion {
        opacity: 1;
      }

      .timeline-window {
        position: absolute;
        z-index: 2;
        top: 58%;
        left: 0;
        width: 100%;
        height: 8rem;
        mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent);
      }

      .timeline-track {
        position: absolute;
        top: 0;
        left: 50%;
        height: 100%;
        will-change: transform;
      }

      .timeline-line {
        position: absolute;
        top: 0;
        left: -100vw;
        width: calc(15 * var(--spacing) + 200vw);
        height: 1px;
        background: var(--line);
      }

      .year-mark {
        position: absolute;
        top: 0;
        left: calc(var(--index) * var(--spacing));
        width: 5rem;
        transform: translateX(-50%);
        color: var(--secondary);
        text-align: center;
        font-size: 0.8125rem;
        letter-spacing: -0.006em;
        opacity: 0.58;
      }

      .year-mark::before {
        content: "";
        display: block;
        width: 1px;
        height: 0.5rem;
        margin: -0.25rem auto 1.15rem;
        background: currentColor;
        opacity: 0.42;
      }

      .center-notch {
        position: absolute;
        z-index: 3;
        top: calc(58% - 0.35rem);
        left: 50%;
        width: 1px;
        height: 0.7rem;
        background: rgba(133, 141, 153, 0.6);
        transform: translateX(-50%);
      }

      .chapter {
        position: absolute;
        z-index: 4;
        top: calc(58% + 3.55rem);
        left: 50%;
        width: min(31rem, calc(100% - 3rem));
        transform: translateX(-50%);
        text-align: center;
        transition: opacity 140ms ease-out;
      }

      .chapter-date,
      .chapter-company,
      .chapter-description {
        margin: 0;
      }

      .chapter-date,
      .chapter-company,
      .chapter-description {
        color: var(--secondary);
        font-size: 0.8125rem;
        letter-spacing: -0.006em;
      }

      .chapter-role {
        margin: 0.18rem 0 0;
        font-size: 1.125rem;
        font-weight: var(--medium);
      }

      .chapter-company {
        margin-top: 0.05rem;
      }

      .chapter-description {
        max-width: 29rem;
        margin: 0.9rem auto 0;
        line-height: 1.5;
      }

      .progress {
        position: absolute;
        z-index: 5;
        right: clamp(1.5rem, 4vw, 3.5rem);
        bottom: clamp(1.5rem, 4vw, 2.5rem);
        width: 3rem;
        height: 1px;
        background: var(--line);
      }

      .progress span {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--text);
        transform: scaleX(0);
        transform-origin: 0 50%;
        will-change: transform;
      }

      @media (max-height: 43rem) {
        .character {
          bottom: 43%;
        }

        .character {
          --character-height: 3.93rem;
        }

        .timeline-window {
          top: 60%;
        }

        .center-notch {
          top: calc(60% - 0.35rem);
        }

        .chapter {
          top: calc(60% + 3.2rem);
        }

        .chapter-description {
          margin-top: 0.45rem;
        }
      }

      @media (max-width: 38rem) {
        :root {
          --spacing: 10.5rem;
        }

        .character {
          bottom: 44%;
        }

        .character {
          --character-height: 3.87rem;
        }

        .timeline-window {
          top: 56%;
        }

        .center-notch {
          top: calc(56% - 0.35rem);
        }

        .chapter {
          top: calc(56% + 3.55rem);
        }

        .scroll-prompt {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .scroll-prompt,
        .year-mark,
        .chapter,
        .character-sprite {
          transition: none;
        }

      }
    </style>
  </head>
  <body>
    <main class="scroll-space">
      <section class="stage" aria-label="Kaj Drobin career timeline">
        <h1 class="site-title">Kaj Drobin<span>Design &amp; Product</span></h1>
        <p class="scroll-prompt">Scroll to walk back in time</p>

        <div class="character" role="img" aria-label="8-bit character of Kaj Drobin">
          <span class="character-sprite character-idle"></span>
          <span class="character-sprite character-motion"></span>
        </div>

        <div class="timeline-window" aria-hidden="true">
          <div class="timeline-track" id="timeline-track">
            <div class="timeline-line"></div>
            <span class="year-mark" style="--index: 0">2024</span>
            <span class="year-mark" style="--index: 1">2023</span>
            <span class="year-mark" style="--index: 2">2022</span>
            <span class="year-mark" style="--index: 3">2021</span>
            <span class="year-mark" style="--index: 4">2020</span>
            <span class="year-mark" style="--index: 5">2019</span>
            <span class="year-mark" style="--index: 6">2018</span>
            <span class="year-mark" style="--index: 7">2017</span>
            <span class="year-mark" style="--index: 8">2016</span>
            <span class="year-mark" style="--index: 9">2015</span>
            <span class="year-mark" style="--index: 10">2014</span>
            <span class="year-mark" style="--index: 11">2013</span>
            <span class="year-mark" style="--index: 12">2012</span>
            <span class="year-mark" style="--index: 13">2011</span>
            <span class="year-mark" style="--index: 14">2010</span>
            <span class="year-mark" style="--index: 15">2009</span>
          </div>
        </div>
        <div class="center-notch" aria-hidden="true"></div>

        <article class="chapter" id="chapter">
          <p class="chapter-date" id="chapter-date">2024–Now</p>
          <h2 class="chapter-role" id="chapter-role">Co-Founder</h2>
          <p class="chapter-company" id="chapter-company">Stilla</p>
          <p class="chapter-description" id="chapter-description">Building Stilla, the multiplayer AI teammate, with the sharpest people I’ve worked with over the past 15 years.</p>
        </article>

        <div class="progress" aria-hidden="true"><span id="progress"></span></div>
      </section>
    </main>

    <script>
      const years = Array.from(document.querySelectorAll('.year-mark'))
      const track = document.querySelector('#timeline-track')
      const character = document.querySelector('.character')
      const motionCharacter = document.querySelector('.character-motion')
      const chapter = document.querySelector('#chapter')
      const date = document.querySelector('#chapter-date')
      const role = document.querySelector('#chapter-role')
      const company = document.querySelector('#chapter-company')
      const description = document.querySelector('#chapter-description')
      const prompt = document.querySelector('.scroll-prompt')
      const progressBar = document.querySelector('#progress')
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches

      const chapters = [
        {
          from: 0,
          to: 0,
          date: '2024–Now',
          role: 'Co-Founder',
          company: 'Stilla',
          description: 'Building Stilla, the multiplayer AI teammate, with the sharpest people I’ve worked with over the past 15 years.'
        },
        {
          from: 1,
          to: 6,
          date: '2018–2024',
          role: 'Director of Product, Shop',
          company: 'Shopify',
          description: 'Co-created the Shop app and Shop Pay, leading their early design and product.'
        },
        {
          from: 7,
          to: 13,
          date: '2011–2018',
          role: 'CPO & Co-Founder',
          company: 'Tictail',
          description: 'Led product and design at Tictail as it scaled to 100k+ online stores and was acquired by Shopify.'
        },
        {
          from: 14,
          to: 15,
          date: '2009–2011',
          role: 'Designer & Partner',
          company: 'Identity Works',
          description: "Built the digital team and worked with international clients, including Shopify's early branding and web design as it launched and scaled."
        }
      ]

      let currentChapter = 0
      let pendingChapter = 0
      let chapterTimer
      let ticking = false
      let spacing
      let targetProgress = 0
      let displayedProgress = 0
      let progressVelocity = 0
      let lastInputY = window.scrollY
      let lastInputTime = performance.now()
      let lastFrameTime = performance.now()
      let lastVisualIndex = 0
      let spritePhase = 0
      let motionMode = 'walk'
      let runUntil = 0
      let fastInputSamples = 0

      const spritePositions = Array.from({ length: 8 }, (_, index) => `${index / 7 * 100}%`)
      const walkSprite = 'url("assets/kaj-walk-right.png")'
      const runSprite = 'url("assets/kaj-run-right.png")'

      ;['assets/kaj-idle-front.png', 'assets/kaj-walk-right.png', 'assets/kaj-run-right.png'].forEach((source) => {
        const image = new Image()
        image.src = source
      })

      const getSpacing = () => {
        const probe = document.createElement('div')
        probe.style.cssText = 'position:absolute;width:var(--spacing);visibility:hidden'
        document.body.appendChild(probe)
        const width = probe.getBoundingClientRect().width
        probe.remove()
        return width
      }

      const setChapter = (index) => {
        if (index === pendingChapter) return
        pendingChapter = index
        clearTimeout(chapterTimer)
        if (index === currentChapter) {
          chapter.style.opacity = '1'
          return
        }
        const update = () => {
          currentChapter = index
          const content = chapters[index]
          date.textContent = content.date
          role.textContent = content.role
          company.textContent = content.company
          description.textContent = content.description
          chapter.style.opacity = '1'
        }
        if (reduceMotion) {
          update()
        } else {
          chapter.style.opacity = '0'
          chapterTimer = setTimeout(update, 140)
        }
      }

      const getProgress = () => {
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight
        return maxScroll > 0 ? Math.min(1, Math.max(0, window.scrollY / maxScroll)) : 0
      }

      const setMotionMode = (mode) => {
        if (mode === motionMode) return
        motionMode = mode
        motionCharacter.style.backgroundImage = motionMode === 'run' ? runSprite : walkSprite
      }

      const render = (now) => {
        ticking = false
        const deltaTime = Math.min(64, Math.max(1, now - lastFrameTime))
        // Exact critically damped spring: preserve velocity across gestures,
        // with no bounce and the same response at every display refresh rate.
        if (reduceMotion) {
          displayedProgress = targetProgress
          progressVelocity = 0
        } else {
          const seconds = deltaTime / 1000
          const frequency = 9.5
          const offset = displayedProgress - targetProgress
          const momentum = progressVelocity + frequency * offset
          const decay = Math.exp(-frequency * seconds)
          displayedProgress = targetProgress + (offset + momentum * seconds) * decay
          progressVelocity = (progressVelocity - frequency * momentum * seconds) * decay
          if (displayedProgress < 0 || displayedProgress > 1) {
            displayedProgress = Math.max(0, Math.min(1, displayedProgress))
            progressVelocity = 0
          }
          if (Math.abs(displayedProgress - targetProgress) < 0.000005 && Math.abs(progressVelocity) < 0.00002) {
            displayedProgress = targetProgress
            progressVelocity = 0
          }
        }

        const exactIndex = displayedProgress * (years.length - 1)
        const yearIndex = Math.round(exactIndex)
        track.style.transform = `translate3d(${-exactIndex * spacing}px, 0, 0)`
        progressBar.style.transform = `scaleX(${displayedProgress})`
        prompt.classList.toggle('is-hidden', displayedProgress > 0.025)
        character.classList.toggle('is-moving', displayedProgress > 0.0005 || targetProgress > 0.0005)

        years.forEach((year, index) => {
          const proximity = Math.max(0, 1 - Math.abs(index - exactIndex))
          year.style.opacity = `${0.58 + proximity * 0.32}`
        })

        const nextChapter = chapters.findIndex((item) => yearIndex >= item.from && yearIndex <= item.to)
        if (nextChapter >= 0) setChapter(nextChapter)

        if (!reduceMotion) {
          setMotionMode(now < runUntil ? 'run' : 'walk')
          const visualDistance = Math.abs(exactIndex - lastVisualIndex) * spacing

          if (visualDistance > 0.02) {
            spritePhase += visualDistance / (motionMode === 'run' ? 18 : 42)
            const frame = Math.floor(spritePhase) % 8
            motionCharacter.style.backgroundPosition = `${spritePositions[frame]} 0%`
          }
        }

        lastVisualIndex = exactIndex
        lastFrameTime = now

        if (displayedProgress !== targetProgress || progressVelocity !== 0) requestRender()
      }

      const requestRender = () => {
        if (ticking) return
        ticking = true
        requestAnimationFrame(render)
      }

      const handleResize = () => {
        spacing = getSpacing()
        targetProgress = getProgress()
        requestRender()
      }

      const handleScroll = () => {
        const now = performance.now()
        const deltaY = window.scrollY - lastInputY
        const deltaTime = Math.max(16, now - lastInputTime)
        const velocity = Math.abs(deltaY) / deltaTime

        if (!ticking) lastFrameTime = now
        targetProgress = getProgress()
        if (deltaTime > 80) fastInputSamples = 0
        fastInputSamples = velocity > 8 ? fastInputSamples + 1 : Math.max(0, fastInputSamples - 1)
        if (fastInputSamples >= 3) runUntil = now + 260
        lastInputY = window.scrollY
        lastInputTime = now
        requestRender()
      }

      spacing = getSpacing()
      targetProgress = getProgress()
      displayedProgress = targetProgress
      lastVisualIndex = displayedProgress * (years.length - 1)
      window.addEventListener('scroll', handleScroll, { passive: true })
      window.addEventListener('resize', handleResize)
      requestRender()
    </script>
  </body>
</html>
