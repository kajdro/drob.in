      .character {

        --ground-clearance: 2px;

      .character.is-entering .character-run {
        animation: entrance-run 600ms steps(8, end) infinite;

        from { background-position: 0% 56%; }
        to { background-position: 114.285714% 56%; }
      }

        left: calc(var(--character-height) * 0.21);

        transform: translateX(-50%) scaleX(var(--shadow-scale));

        transform: translate3d(var(--foot-offset), var(--body-lift), 0) scaleY(var(--body-scale));
        transform-origin: 50% 100%;
        transition: none;
        will-change: opacity;
      }

      .character.is-facing-left .character-sprite {
        transform: translate3d(var(--foot-offset), var(--body-lift), 0) scale(-1, var(--body-scale));
      }

      /* Sprite sheets are sized for 3x screens. AVIF where supported, PNG otherwise. */
      .character-turn {

        width: calc(var(--character-height) * 305 / 660);

        background-position: 0% 0%;
        background-size: 400% 100%;
        opacity: 1;
      }

        left: calc(var(--character-height) * -0.02);
        visibility: hidden;
        width: calc(var(--character-height) * 264 / 525);
        height: calc(var(--character-height) * 541 / 525);
        bottom: calc(0.6rem - var(--character-height) * 8 / 525);
        background-image: url("assets/versioned/kaj-walk-clean.f9d7ec000f3e.png");

        background-position: 0% 0%;
        background-size: 800% 100%;
        opacity: 0;
        filter: brightness(0.9) saturate(0.88) contrast(1.04);
      }

      .character-run {

        background-image: url("assets/versioned/kaj-run-refined.340281aa0711.jpg");
        background-position: 0% 56%;

        width: calc(var(--character-height) * 271.5 / 424);
        height: var(--character-height);

          description: "Built the digital team. Created Spotify’s early brand guidelines, launch party, and launch films, including for its US debut."

      const firstYear = chapters[chapters.length - 1].start
      const years = Array.from({ length: currentYear - firstYear + 1 }, (_, index) => {

        timelineScrollY = position
        const now = performance.now()
        const deltaY = timelineScrollY - lastInputY
        if (deltaY === 0) {
          targetProgress = getProgress()
          requestRender()
          return
        }
        const deltaTime = Math.max(16, now - lastInputTime)
        const velocity = Math.abs(deltaY) / deltaTime
        if (!touchGesture && !swipeMomentum && (timelineScrollY <= TURN_SCROLL_DISTANCE || characterTurn === 0)) {
          // Establish desktop facing during the turn-in distance, before the
          // timeline has any visible movement from which to infer direction.
          travelDirection = Math.sign(deltaY)
          directionDistance = 0
        }

        if (!ticking) lastFrameTime = now
        targetProgress = getProgress()
        if (deltaTime > 80) fastInputSamples = 0
        const touchInput = touchGesture !== null || swipeMomentum !== null
        const runThreshold = touchInput ? 5.75 : 2.8
        const requiredSamples = touchInput ? 3 : 2
        fastInputSamples = velocity > runThreshold ? fastInputSamples + 1 : Math.max(0, fastInputSamples - 1)
        if (!automaticWalk && fastInputSamples >= requiredSamples) runUntil = now + (touchInput ? 260 : 450)
        lastInputY = timelineScrollY
        lastInputTime = now
        requestRender()
      }

      const handleScroll = () => {
        // Ignore startup scroll notifications that have not moved the page.
        if (entrance && window.scrollY === timelineScrollY) return
        if (entrance) finishEntrance()
        // Native events can be delayed during iOS touch gestures. The gesture owns
        // the position until release; only then do we sync the browser scroll.
        if (touchGesture || swipeMomentum || automaticWalk) return
        updateScrollPosition(window.scrollY)
      }

      spacing = getSpacing()
      characterHeight = runCharacter.getBoundingClientRect().height || 64
      // Open a shared chapter link (for example /#shopify) at that chapter,
      // unless the restored scroll position is already inside it.
      const linkedChapter = hashChapter()
      const startIndex = Math.floor(getProgress() * (years.length - 1) + 0.000001)
      if (linkedChapter > 0 && chapterForYear[startIndex] !== linkedChapter) {
        const linkedY = scrollYForYear(chapters[linkedChapter].from)
        window.scrollTo(0, linkedY)
        timelineScrollY = lastInputY = linkedY
      }
      targetProgress = getProgress()
      displayedProgress = targetProgress
      lastVisualIndex = displayedProgress * (years.length - 1)
      window.addEventListener('scroll', handleScroll, { passive: true })
      window.addEventListener('resize', handleResize)
      showEntrance()
      requestRender()
    </script>
  </body>
</html>
